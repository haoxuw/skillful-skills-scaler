[project]
name = "skillful-skills-scaler"
version = "0.1.0"
description = "Import, patch, sync, reorganize, and deprecate agent skills across repos."
license = "Apache-2.0"
authors = [{name = "Google LLC"}]
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[project.scripts]
sss = "sss.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
